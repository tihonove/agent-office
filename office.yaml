# yaml-language-server: $schema=./packages/shared/manifest.schema.json
#
# Офис для самого agent-office: мы разрабатываем офис офисом.
#
#   npm run office            поднять офис на этом репозитории → http://127.0.0.1:4700
#
# Путь заявки:
#
#   новая ─штурман→ к анализу ─аналитик→ согласование ─человек: «делаем»→ к реализации ─реализатор→ к стенду
#         ─штурман-стенд→ приёмка ─человек: «вливать»→ к вливанию ─штурман-вливание→ готово
#
#   «переделать» на согласовании и «доработать» на приёмке возвращают заявку аналитику:
#   любая доработка идёт через постановку, а не мимо неё.
#
# Человек участвует дважды и оба раза обязательно: «что делать будем» (постановка) и «принимаем ли» (живой стенд).
# Его молчание ничего не запускает и ничего не вливает — заявка откладывается.

inbox: { kind: заявка, state: новая }

kinds:
  заявка:
    states:
      - новая                 # ждёт штурмана
      - прокладка             # штурман решает: в работу, разбить, отказать
      - разбита               # учётный узел: работа идёт в детях
      - к анализу
      - анализ
      - согласование          # человек: что делать будем
      - к реализации
      - реализация
      - к стенду
      - подъём стенда
      - приёмка               # человек: смотрит живой стенд
      - к вливанию
      - вливание
      - готово
      - отклонена
      - отложена              # человек промолчал или сам отложил; вернуть — вызвать роль руками (см. requests)
    closed: [готово, отклонена, отложена]

resources:                    # что агенты делят между собой; кому не хватило — ждёт следующего тика
  машина: 1                   # тесты и стенд грузят её целиком

executors:
  # args идут в claude насквозь; офис их не толкует.
  штурман:
    type: claude
    model: sonnet
    args: [--permission-mode, acceptEdits, --allowedTools, 'Bash(git *)', 'Bash(npm *)', 'Bash(node scripts/stand.ts *)', 'Bash(curl *)']
  аналитик:
    type: claude
    model: opus
    args: [--permission-mode, acceptEdits, --allowedTools, 'Bash(git log *)', 'Bash(git show *)', 'Bash(git diff *)']
  реализатор:
    type: claude
    model: opus
    takes: { машина: 1 }      # один реализатор на всю машину
    args: [--permission-mode, acceptEdits, --allowedTools, 'Bash(git *)', 'Bash(npm *)', 'Bash(npx *)', 'Bash(node *)']

areas:                        # офис карту не толкует — кладёт в проекцию, чтобы роли говорили об одном и том же
  модель: [packages/shared/src/**]
  ядро: [packages/office/src/core/**]
  сервисы: [packages/office/src/services/**, packages/office/src/modules/**, packages/office/src/platform/**]
  адаптеры: [packages/office/src/adapters/**]
  манифест: [packages/office/src/manifest/**, packages/shared/manifest.schema.json]
  дашборда: [packages/dashboard/**]
  примеры: [examples/**]
  наш офис: [office.yaml, office/**, scripts/**]

roles:
  # ── Штурман ведёт заявку по курсу: на входе, на стенде, на вливании ──

  штурман:
    executor: штурман
    prompt: office/roles/штурман.md
    when: { kind: заявка, state: новая }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: прокладка
      outcomes: { в работу: к анализу, разбито: разбита, отказ: отклонена }

  штурман-стенд:
    executor: штурман
    prompt: office/roles/штурман-стенд.md
    when: { kind: заявка, state: к стенду }
    sees: [{ kind: отчёт }, { kind: постановка }]
    takes: { машина: 1 }      # стенд поднимается на той же машине, что и тесты реализатора
    arrows:
      start: подъём стенда
      outcomes: { поднят: приёмка, не поднялся: к реализации }

  штурман-вливание:
    executor: штурман
    prompt: office/roles/штурман-вливание.md
    when: { kind: заявка, state: к вливанию }
    sees: [{ kind: отчёт }, { kind: стенд }]
    arrows:
      start: вливание
      outcomes: { влито: готово, не влилось: к реализации }

  # ── Аналитик: что делать будем. Всё, что он решил, подтверждает человек ──

  аналитик:
    executor: аналитик
    prompt: office/roles/аналитик.md
    when: { kind: заявка, state: к анализу }
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: анализ
      outcomes: { готово: согласование, отказ: отклонена }

  # ── Реализатор: делает по согласованной постановке, в своём worktree ──

  реализатор:
    executor: реализатор
    prompt: office/roles/реализатор.md
    when: { kind: заявка, state: к реализации }
    needs: [критерий, область]           # зрелость: без согласованного критерия готовности не начинаем
    sees:
      - { kind: постановка, from: [self, ancestors] }
      - { kind: замечания }               # почему не поднялся стенд или не влилось
      - { kind: отчёт }                   # свой прошлый отчёт — при доработке
    arrows:
      start: реализация
      outcomes: { готово: к стенду }

transitions:
  # согласование постановки
  - { kind: заявка, from: согласование, to: к реализации, when: { answer: { request: постановка, is: делаем } } }
  - { kind: заявка, from: согласование, to: к анализу,    when: { answer: { request: постановка, is: переделать } } }
  - { kind: заявка, from: согласование, to: отклонена,    when: { answer: { request: постановка, is: не делаем } } }
  - { kind: заявка, from: согласование, to: отложена,     when: { answer: { request: постановка, is: отложить } } }
  # приёмка на живом стенде
  - { kind: заявка, from: приёмка, to: к вливанию, when: { answer: { request: приёмка, is: вливать } } }
  - { kind: заявка, from: приёмка, to: к анализу,  when: { answer: { request: приёмка, is: доработать } } }
  - { kind: заявка, from: приёмка, to: отложена,   when: { answer: { request: приёмка, is: отложить } } }
  # учётный узел закрывается по детям
  - { kind: заявка, from: разбита, to: готово, when: { children: { all: [готово, отклонена] } } }

spawns:
  # Штурман разбивает большую заявку артефактом «курс». Дети идут сразу аналитику; одновременно открыты не больше двух.
  - { artifact: курс, kind: заявка, state: к анализу, requires: [описание], maxOpen: 2 }

requests:
  - id: постановка
    when: { kind: заявка, state: согласование }
    question: >-
      Аналитик подготовил постановку (артефакт «постановка» на карточке узла). Что делать будем?
      Для «переделать» сначала запиши узлу поле «замечания» — аналитик увидит его.
    options: [делаем, переделать, не делаем, отложить]
    default: отложить         # молчание ничего не запускает. Вернуть отложенную: вызвать руками роль «аналитик»
    deadline: 3d

  - id: приёмка
    when: { kind: заявка, state: приёмка }
    question: >-
      Стенд поднят — адрес в артефакте «стенд» на карточке узла. Принимаем?
      Для «доработать» сначала запиши узлу поле «замечания»: доработка пойдёт через аналитика.
    options: [вливать, доработать, отложить]
    default: отложить         # молчание ничего не вливает. Вернуть отложенную: вызвать руками роль «штурман-стенд»
    deadline: 3d

askDeadline: 1d
