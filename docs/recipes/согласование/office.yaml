# yaml-language-server: $schema=./node_modules/@tihonove/agent-office/dist/manifest.schema.json
#
# Готовая схема «согласование»: человек подтверждает постановку до того, как начнётся реализация.
# Гейтов в офисе нет — «гейт» здесь собран из запроса человеку и переходов по его ответу.
# Описание — docs/recipes.md. Скопируй каталог в корень проекта целиком: office.yaml, office/roles/, fake/.
#
#   новая ─аналитик→ согласование ─«делаем»→ к реализации ─реализатор→ приёмка ─«принять»→ готово
#                                 ─«переделать»→ новая (аналитик пишет новую редакцию)
#                                 ─«не делаем»→ отклонена
#                                 ─«отложить» или молчание→ отложена
#   на приёмке «вернуть» → к реализации, «отложить» или молчание → отложена

inbox: { kind: заявка, state: новая }

kinds:
  заявка:
    states: [новая, анализ, согласование, к реализации, реализация, приёмка, готово, отклонена, отложена]
    closed: [готово, отклонена, отложена]

executors:
  читатель: { type: claude, model: sonnet, args: [--permission-mode, acceptEdits, --allowedTools, 'Bash(git log *)', 'Bash(git show *)'] }
  разработчик: { type: claude, model: sonnet, args: [--permission-mode, acceptEdits, --allowedTools, 'Bash(git *)', 'Bash(npm *)'] }

roles:
  аналитик:
    executor: читатель
    prompt: office/roles/аналитик.md
    when: { kind: заявка, state: новая }
    needs: [описание]
    sees: [{ kind: '*', from: [self, ancestors] }]
    arrows:
      start: анализ
      outcomes: { готово: согласование, отказ: отклонена }

  реализатор:
    executor: разработчик
    prompt: office/roles/реализатор.md
    when: { kind: заявка, state: к реализации }
    needs: [критерий]
    sees: [{ kind: постановка }, { kind: отчёт }]
    arrows:
      start: реализация
      outcomes: { готово: приёмка }

transitions:
  # согласование постановки
  - { kind: заявка, from: согласование, to: к реализации, when: { answer: { request: постановка, is: делаем } } }
  - { kind: заявка, from: согласование, to: новая,        when: { answer: { request: постановка, is: переделать } } }
  - { kind: заявка, from: согласование, to: отклонена,    when: { answer: { request: постановка, is: не делаем } } }
  - { kind: заявка, from: согласование, to: отложена,     when: { answer: { request: постановка, is: отложить } } }
  # приёмка результата
  - { kind: заявка, from: приёмка, to: готово,       when: { answer: { request: приёмка, is: принять } } }
  - { kind: заявка, from: приёмка, to: к реализации, when: { answer: { request: приёмка, is: вернуть } } }
  - { kind: заявка, from: приёмка, to: отложена,     when: { answer: { request: приёмка, is: отложить } } }

requests:
  - id: постановка
    when: { kind: заявка, state: согласование }
    question: >-
      Аналитик подготовил постановку (артефакт «постановка» на карточке узла). Что делать будем?
      Для «переделать» сначала запиши узлу поле «замечания» — аналитик его увидит.
    options: [делаем, переделать, не делаем, отложить]
    default: отложить         # молчание ничего не запускает
    deadline: 3d

  - id: приёмка
    when: { kind: заявка, state: приёмка }
    question: >-
      Реализатор сдал работу (артефакт «отчёт» на карточке узла). Принять?
      Для «вернуть» сначала запиши узлу поле «замечания» — реализатор его увидит.
    options: [принять, вернуть, отложить]
    default: отложить
    deadline: 3d
